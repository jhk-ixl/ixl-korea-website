<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External Sources | IXL Korea Manager</title>
  <link rel="stylesheet" href="manager.css">
  <script src="manager-guard.js"></script>
  <style>
    .source-toolbar,.source-editor{margin-top:24px;padding:20px;background:#fff;border:1px solid #dfe5ec;border-radius:10px}
    .source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .source-field{display:flex;flex-direction:column;gap:7px}.source-field.full{grid-column:1/-1}
    .source-field label{font-size:13px;font-weight:700;color:#3f4f60}.source-field input,.source-field select,.source-field textarea{padding:10px 12px;border:1px solid #cfd8e3;border-radius:6px;font:inherit}
    .source-field textarea{min-height:110px}.source-actions{display:flex;gap:10px;margin-top:18px}.source-actions button{padding:9px 14px;border:1px solid #cfd8e3;border-radius:6px;background:#fff;cursor:pointer;font-weight:700}.source-actions .primary{background:#071b33;color:#fff;border-color:#071b33}
    .source-list{margin-top:24px;background:#fff;border:1px solid #dfe5ec;border-radius:10px;overflow:hidden}.source-list table{width:100%;border-collapse:collapse}.source-list th,.source-list td{padding:13px 14px;border-bottom:1px solid #e8edf2;text-align:left;vertical-align:top}.source-list th{background:#f6f8fa;font-size:12px}.source-list a{color:#0b67b2}.small-btn{padding:6px 9px;margin-right:5px;border:1px solid #cfd8e3;background:#fff;border-radius:5px;cursor:pointer}.message{min-height:20px;margin-top:12px;color:#667482}@media(max-width:760px){.source-grid{grid-template-columns:1fr}.source-field.full{grid-column:auto}.source-list{overflow:auto}}
  </style>
</head>
<body>
  <header class="manager-header">
    <div class="manager-brand"><h1>IXL KOREA MANAGER</h1><p>Innovation Knowledge Ecosystem Control Center</p></div>
    <nav class="manager-nav" data-manager-nav="knowledge"></nav>
  </header>
  <main class="manager-main">
    <section class="manager-page-heading manager-page-head"><span class="section-eyebrow">EXTERNAL SOURCE</span><h2>External Sources</h2><p>Register and maintain external articles, websites, reports, videos and reference URLs. These are references, not internal Assets.</p></section>
    <section class="source-toolbar"><button type="button" id="add-source" class="library-button primary">Add External Source</button></section>
    <section class="source-editor" id="source-editor" hidden>
      <h3 id="editor-title">Add External Source</h3>
      <div class="source-grid">
        <div class="source-field"><label for="source-title">Title *</label><input id="source-title" type="text"></div>
        <div class="source-field"><label for="source-type">Type</label><select id="source-type"><option value="website">Website</option><option value="article">Article</option><option value="report">Report</option><option value="video">Video</option><option value="research">Research</option><option value="other">Other</option></select></div>
        <div class="source-field full"><label for="source-url">URL *</label><input id="source-url" type="url" placeholder="https://..."></div>
        <div class="source-field"><label for="source-name">Source / Organization</label><input id="source-name" type="text" placeholder="ISO, IXL Center, YouTube..."></div>
        <div class="source-field"><label for="source-reference">Reference</label><input id="source-reference" type="text" placeholder="Author, publication, year..."></div>
        <div class="source-field full"><label for="source-notes">Notes</label><textarea id="source-notes"></textarea></div>
      </div>
      <div class="source-actions"><button id="save-source" class="primary" type="button">Save</button><button id="cancel-source" type="button">Cancel</button></div>
      <div id="source-message" class="message"></div>
    </section>
    <section class="source-list manager-canonical-table-wrap"><table class="manager-canonical-table" data-manager-sortable data-default-sort-key="title"><thead><tr><th><button type="button" class="manager-sort-button" data-sort-key="type">Type <span class="manager-sort-indicator" aria-hidden="true"></span></button></th><th><button type="button" class="manager-sort-button" data-sort-key="title">Title <span class="manager-sort-indicator" aria-hidden="true"></span></button></th><th><button type="button" class="manager-sort-button" data-sort-key="source">Source <span class="manager-sort-indicator" aria-hidden="true"></span></button></th><th><button type="button" class="manager-sort-button" data-sort-key="url">URL <span class="manager-sort-indicator" aria-hidden="true"></span></button></th><th>Actions</th></tr></thead><tbody id="source-body"></tbody></table></section>
  </main>
<script>
const API='/api/insights-library?resource=externalsources';let items=[];let editingIndex=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const body=document.getElementById('source-body');body.innerHTML=items.length?items.map((x,i)=>`<tr><td>${esc(x.sourceType||'')}</td><td>${esc(x.title||'')}</td><td>${esc(x.sourceName||'')}</td><td><a href="${esc(x.url||'')}" target="_blank" rel="noopener noreferrer">Open ↗</a></td><td><button class="small-btn" data-edit="${i}">Edit</button><button class="small-btn" data-delete="${i}">Delete</button></td></tr>`).join(''):'<tr><td colspan="5">No external sources registered.</td></tr>';}
async function load(){const r=await fetch(API,{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error('External Sources could not be loaded.');items=await r.json();render();}
function openEditor(index=null){editingIndex=index;const x=index===null?{}:items[index]||{};document.getElementById('editor-title').textContent=index===null?'Add External Source':'Edit External Source';document.getElementById('source-title').value=x.title||'';document.getElementById('source-type').value=x.sourceType||'website';document.getElementById('source-url').value=x.url||'';document.getElementById('source-name').value=x.sourceName||'';document.getElementById('source-reference').value=x.reference||'';document.getElementById('source-notes').value=x.notes||'';document.getElementById('source-editor').hidden=false;}
function closeEditor(){editingIndex=null;document.getElementById('source-editor').hidden=true;document.getElementById('source-message').textContent='';}
async function save(){const payload={title:document.getElementById('source-title').value.trim(),sourceType:document.getElementById('source-type').value,url:document.getElementById('source-url').value.trim(),sourceName:document.getElementById('source-name').value.trim(),reference:document.getElementById('source-reference').value.trim(),notes:document.getElementById('source-notes').value.trim()};if(editingIndex!==null)payload.index=editingIndex;const r=await fetch(API,{method:editingIndex===null?'POST':'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Save failed.');await load();closeEditor();}
async function remove(index){if(!confirm('Delete this External Source?'))return;const r=await fetch(API,{method:'DELETE',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({index})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Delete failed.');await load();}
document.getElementById('add-source').onclick=()=>openEditor();document.getElementById('cancel-source').onclick=closeEditor;document.getElementById('save-source').onclick=()=>save().catch(e=>document.getElementById('source-message').textContent=e.message);document.getElementById('source-body').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.edit!==undefined)openEditor(Number(b.dataset.edit));if(b.dataset.delete!==undefined)remove(Number(b.dataset.delete)).catch(err=>alert(err.message));};load().catch(e=>alert(e.message));
</script>
<script src="manager-common.js"></script>
</body>
</html>
