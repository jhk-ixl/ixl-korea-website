# IXL KOREA CMS — dedicated Markdown Article authoring
backend:
  name: github
  repo: jhk-ixl/ixl-korea-website
  branch: master
  base_url: https://ixlkorea.co.kr
  auth_endpoint: auth
  site_domain: https://ixlkorea.co.kr

media_folder: "insightscontent/articles/media"
public_folder: "/insightscontent/articles/media"

collections:
  - name: "markdown_articles"
    label: "Markdown Articles"
    label_singular: "Markdown Article"
    folder: "insightscontent/articles"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} · {{title}}"
    fields:
      - label: "Content Ref"
        name: "contentRef"
        widget: "string"
        hint: "Stable CMS content identifier. Do not change after this article is linked to Knowledge. Example: article-innovation-5-0"
      - label: "Knowledge ID"
        name: "knowledgeId"
        widget: "string"
        required: false
        hint: "Optional until this article is linked to a Knowledge Item. After linking, enter the stable kn_... ID."
      - label: "Language"
        name: "language"
        widget: "select"
        options:
          - { label: "Korean", value: "ko" }
          - { label: "Other", value: "other" }
        default: "other"
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Author"
        name: "author"
        widget: "string"
        required: false
      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false
      - label: "Article Body"
        name: "body"
        widget: "markdown"
