# IXL KOREA CMS — dedicated Markdown Article authoring
backend:
  name: github
  repo: jhk-ixl/ixl-korea-website
  branch: master
  base_url: https://ixlkorea.co.kr
  auth_endpoint: auth
  site_domain: https://ixlkorea.co.kr

media_folder: "insightscontent/articles/media"
public_folder: "/insightscontent/articles/media"

collections:
  - name: "markdown_articles"
    label: "Markdown Articles"
    label_singular: "Markdown Article"
    folder: "insightscontent/articles"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} · {{title}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Author"
        name: "author"
        widget: "string"
        required: false
      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false
      - label: "Article Body"
        name: "body"
        widget: "markdown"
