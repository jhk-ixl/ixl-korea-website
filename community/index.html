<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IXL Korea Community</title>

  <link rel="stylesheet" href="community.css">
</head>

<body>

  <header class="community-header">
    <a class="community-brand" href="/">
      <img src="../ixl-korea-logo.png" alt="IXL Korea">
    </a>

    <a class="back-home" href="/">IXL Korea Home</a>
  </header>

  <main class="community-main">

    <section class="community-intro">
      <p class="eyebrow">IXL KOREA COMMUNITY</p>

      <h1>Innovation Community</h1>

      <p>
        Connect, learn and collaborate with the IXL Korea
        innovation ecosystem.
      </p>
    </section>

    <section class="auth-card">

      <div class="auth-tabs">
        <button
          class="auth-tab active"
          id="login-tab"
          type="button"
        >
          Sign In
        </button>

        <button
          class="auth-tab"
          id="signup-tab"
          type="button"
        >
          Create Account
        </button>
      </div>

      <form id="auth-form">

        <div
          class="form-field"
          id="full-name-field"
          hidden
        >
          <label for="full-name">Full Name</label>

          <input
            id="full-name"
            name="full_name"
            type="text"
            autocomplete="name"
          >
        </div>

        <div class="form-field">
          <label for="email">Email</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-field">
          <label for="password">Password</label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          >
        </div>

        <button
          class="auth-submit"
          id="auth-submit"
          type="submit"
        >
          Sign In
        </button>

        <p
          class="auth-message"
          id="auth-message"
          aria-live="polite"
        ></p>

      </form>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/community/community-supabase.js"></script>
  <script src="/community/community-auth.js"></script>
  <script src="community.js"></script>

</body>
</html>
